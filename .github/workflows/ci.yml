name: Validate MVP
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: test-results
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: care-manager-quest-dist
          path: dist
          retention-days: 7
  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: care-manager-quest-dist
          path: dist
      - name: Prepare deployment variables
        run: node scripts/cloudflare-config.mjs
        env:
          ACCESS_TEAM: ${{ vars.CLOUDFLARE_ACCESS_TEAM }}
          ACCESS_AUD: ${{ vars.CLOUDFLARE_ACCESS_AUD }}
          ACCESS_EMAIL: ${{ vars.CLOUDFLARE_ACCESS_EMAIL }}
      - name: Confirm this is still the latest main
        id: current
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.getBranch({ ...context.repo, branch: 'main' });
            core.setOutput('latest', data.commit.sha === context.sha ? 'true' : 'false');
      - name: Deploy tested assets to Cloudflare
        if: steps.current.outputs.latest == 'true'
        run: npx --no-install wrangler deploy --config wrangler.ci.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
