name: Validate taxonomy metadata
on:
  pull_request:
    paths:
      - 'data/taxonomy/**'
      - 'docs/taxonomy/**'
      - 'scripts/validate-taxonomy.py'
      - 'scripts/*issue32*.mjs'
      - '.github/workflows/taxonomy.yml'
  push:
    branches: [main]
    paths:
      - 'data/taxonomy/**'
      - 'docs/taxonomy/**'
      - 'scripts/validate-taxonomy.py'
      - 'scripts/*issue32*.mjs'
      - '.github/workflows/taxonomy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-taxonomy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate-taxonomy.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate-issue32-classifications.mjs
      - run: node scripts/validate-issue32-revisions.mjs
      - run: node scripts/normalize-issue32-ids.mjs --check
      - run: node scripts/test-issue32-ids.mjs
      - run: node scripts/normalize-issue32-ids.mjs --audit
      - run: node scripts/test-issue32-drawers.mjs
      - name: Generate reusable knowledge drawers and review report
        run: |
          mkdir -p build/issue32
          node scripts/normalize-issue32-ids.mjs --jsonl > build/issue32/proposition-drawer-index.jsonl
          node scripts/normalize-issue32-ids.mjs --drawers > build/issue32/knowledge-drawers.jsonl
          node scripts/normalize-issue32-ids.mjs --path-drawers > build/issue32/original-path-to-drawers.jsonl
          node scripts/normalize-issue32-ids.mjs --review > build/issue32/review-required-drawers.jsonl
          node scripts/normalize-issue32-ids.mjs --aliases > build/issue32/question-id-aliases.json
          node scripts/normalize-issue32-ids.mjs --report > build/issue32/normalization-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: issue32-normalized-drawers
          path: build/issue32/
          if-no-files-found: error
          retention-days: 14
